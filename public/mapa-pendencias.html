      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --done: #22c55e;
      --partial: #eab308;
      --pending: #ef4444;
      --doc: #3b82f6;
      --line: #334155;
      --accent: #3b82f6;
      --mvp: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
    header { padding: 1.25rem 2rem; border-bottom: 1px solid var(--line); background: linear-gradient(135deg, #1a2332 0%, #0f1419 100%); position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    header h1 span { color: var(--accent); }
    .mvp-badge { display: inline-block; background: rgba(168,85,247,0.2); color: var(--mvp); border: 1px solid var(--mvp); border-radius: 6px; font-size: 0.7rem; font-weight: 800; padding: 0.15rem 0.5rem; letter-spacing: 0.08em; }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.35rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-top: 1rem; }
    .stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-right: auto; }
    .stat { padding: 0.35rem 0.75rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface); }
    .stat.done { border-color: var(--done); color: var(--done); }
    .stat.partial { border-color: var(--partial); color: var(--partial); }
    .stat.pending { border-color: var(--pending); color: var(--pending); }
    .filter-btn { padding: 0.4rem 0.9rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.85rem; }
    .filter-btn:hover, .filter-btn.active { border-color: var(--accent); background: var(--surface2); }
    main { display: grid; grid-template-columns: 1fr 340px; min-height: calc(100vh - 130px); }
    @media (max-width: 1100px) { main { grid-template-columns: 1fr; } .detail-panel { border-left: none !important; border-top: 1px solid var(--line); } }
    .map-area { padding: 2rem; overflow: auto; }
    .root-node { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: #fff; padding: 1rem 1.75rem; border-radius: 16px; font-weight: 800; text-align: center; margin-bottom: 1.5rem; cursor: pointer; max-width: 340px; margin-left: auto; margin-right: auto; }
    .root-node small { display: block; font-weight: 500; font-size: 0.75rem; opacity: 0.85; margin-top: 0.2rem; }
    .branches { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; max-width: 1400px; margin: 0 auto; }
    .branch { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .branch-header { padding: 0.85rem 1rem; font-weight: 700; display: flex; justify-content: space-between; cursor: pointer; border-bottom: 1px solid var(--line); }
    .branch-body { padding: 0.5rem; }
    .node { display: flex; gap: 0.5rem; padding: 0.55rem 0.65rem; border-radius: 8px; cursor: pointer; }
    .node:hover, .node.selected { background: var(--surface2); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 0.35rem; flex-shrink: 0; }
    .status-dot.done { background: var(--done); }
    .status-dot.partial { background: var(--partial); }
    .status-dot.pending { background: var(--pending); }
    .status-dot.doc { background: var(--doc); }
    .node-title { font-size: 0.9rem; font-weight: 600; }
    .node-sub { font-size: 0.75rem; color: var(--muted); }
    .detail-panel { padding: 1.5rem; border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; }
    .detail-panel h2 { font-size: 1.15rem; margin-bottom: 0.5rem; }
    .detail-panel ul { margin: 0.75rem 0 0 1.1rem; font-size: 0.9rem; color: var(--muted); }
    .detail-panel ul li { margin-bottom: 0.3rem; }
    .detail-badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 6px; margin-bottom: 0.5rem; }
    .detail-badge.done { background: rgba(34,197,94,0.2); color: var(--done); }
    .detail-badge.partial { background: rgba(234,179,8,0.2); color: var(--partial); }
    .detail-badge.pending { background: rgba(239,68,68,0.2); color: var(--pending); }
    .ref { margin-top: 1rem; font-size: 0.8rem; color: var(--muted); font-family: monospace; }
    .legend { display: flex; flex-wrap: wrap; gap: 1rem; padding: 1rem 2rem; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--muted); }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; }
    a.home-link { color: var(--accent); margin-left: 1rem; font-size: 0.85rem; }
    .section-note { font-size: 0.78rem; color: var(--muted); background: var(--surface2); border-radius: 6px; padding: 0.4rem 0.7rem; margin-top: 0.75rem; }
  </style>
</head>

        pending: all.filter(i => i.status === "pending").length,
        total:   all.length
      };
    }

    function renderStats() {
      const s = countStats();
      document.getElementById("stats").innerHTML =
        `<span class="stat done">${s.done} prontos</span>
         <span class="stat partial">${s.partial} parciais</span>
         <span class="stat pending">${s.pending} pendentes</span>
         <span class="stat">${s.total} itens</span>`;
    }

    function renderBranches() {
      document.getElementById("branches").innerHTML = DATA.map(branch => {
        const visibleItems = activeFilter === "all"
          ? branch.items
          : branch.items.filter(i => i.status === activeFilter);
        if (visibleItems.length === 0) return "";
        return `
        <div class="branch">
          <div class="branch-header"><span>${branch.icon} ${branch.title}</span></div>
          <div class="branch-body">
            ${visibleItems.map(item => `
              <div class="node" data-id="${item.id}" data-status="${item.status}">
                <span class="status-dot ${item.status}"></span>
                <div>
                  <div class="node-title">${item.title}</div>
                  <div class="node-sub">${statusLabels[item.status]}</div>
                </div>
              </div>`).join("")}
          </div>
        </div>`;
      }).join("");
      document.querySelectorAll(".node").forEach(n => n.addEventListener("click", () => selectNode(n.dataset.id)));
    }

    function findItem(id) {
      for (const b of DATA) {
        const item = b.items.find(i => i.id === id);
        if (item) return { ...item, branch: b.title };
      }
      return null;
    }

    function selectNode(id) {
      selectedId = id;
      document.querySelectorAll(".node").forEach(n => n.classList.toggle("selected", n.dataset.id === id));
      const item = findItem(id);
      const panel = document.getElementById("detail");
      if (!item) return;
      panel.innerHTML = `
        <span class="detail-badge ${item.status}">${statusLabels[item.status]}</span>
        <h2>${item.title}</h2>
        <p style="color:var(--muted);font-size:0.8rem;margin-bottom:0.5rem">${item.branch}</p>
        <p style="font-size:0.9rem">${item.desc}</p>
        ${item.bullets.length ? `<ul>${item.bullets.map(b => `<li>${b}</li>`).join("")}</ul>` : ""}
        <div class="ref">📁 ${item.ref}</div>`;
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderBranches();
        if (selectedId) {
          const node = document.querySelector(`[data-id="${selectedId}"]`);
          if (!node) document.getElementById("detail").innerHTML = `<div style="color:var(--muted)">Clique em um item para ver detalhes.</div>`;
        }
      });
    });

    document.querySelector(".root-node").addEventListener("click", () => {
      const s = countStats();
      document.getElementById("detail").innerHTML = `
        <h2>Visão geral — MVP v0.1</h2>
        <p style="margin-top:0.75rem;font-size:0.9rem">Chat efêmero com salas temporárias. Dois planos:</p>
        <ul style="margin-top:0.75rem;font-size:0.88rem;color:var(--muted)">
          <li><strong style="color:var(--text)">Free:</strong> 1 sala, 6h fixas, skin WhatsApp</li>
          <li><strong style="color:var(--text)">Premium US$5,99/mês:</strong> múltiplas salas, 1–24h, qualquer skin</li>
        </ul>
        <p style="margin-top:1rem;font-size:0.88rem;color:var(--muted)">Skin é da <strong style="color:var(--text)">pessoa</strong>, não da sala. Cada participante escolhe a sua.</p>
        <ul style="margin-top:1rem;font-size:0.88rem">
          <li><strong style="color:var(--done)">${s.done}</strong> prontos</li>
          <li><strong style="color:var(--partial)">${s.partial}</strong> parciais</li>
          <li><strong style="color:var(--pending)">${s.pending}</strong> pendentes</li>
        </ul>
        <div class="section-note" style="margin-top:1rem">
          <strong>Bloqueadores de lançamento:</strong><br>
          Git init → push → Vercel deploy → Supabase prod → pg_cron → Verificação de plano nas APIs
        </div>`;
    });

    renderStats();
    renderBranches();
  </script>
</body>
</html>
